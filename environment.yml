# You can create the environment with this:
# conda env create -f environment.yml

# Activate it with:
# conda activate der-data-urop

name: der-data-urop
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11.7
  - numpy=1.26.4
  - pandas=2.3.3
  - requests=2.32.5
  - openpyxl=3.1.5
  - matplotlib=3.10.7
  - seaborn=0.12.2
  - plotly=5.9.0
  - scikit-learn=1.7.2
  - statsmodels=0.14.6
  - patsy=1.0.2
  - llvm-openmp  # OpenMP runtime required by xgboost (pip users: brew install libomp)
  - xgboost=3.2.0
  - umap-learn=0.5.7
  - geopandas=0.14.4
  - shapely=2.0.5
  - jupyter=1.1.1
  - notebook=6.5.4
  - ipykernel=7.2.0
  - pip
